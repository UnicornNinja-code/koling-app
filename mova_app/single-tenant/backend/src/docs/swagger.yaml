components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserCreateInput:
      type: object
      required:
        - email
        - username
        - password
        - name
        - role
      properties:
        email:
          type: string
          format: email
          example: supervisor1@kopikeliling.com
        username:
          type: string
          example: supervisor1
        password:
          type: string
          format: password
          example: password123
        name:
          type: string
          example: 'Supervisor Lapangan Sidoarjo'
        phone:
          type: string
          example: '081234567890'
        role:
          type: string
          enum:
            - SUPERADMIN
            - MANAGEMENT
            - SUPERVISOR
            - RIDER
          example: SUPERVISOR
    ZoneInput:
      type: object
      required:
        - name
        - polygon
      properties:
        name:
          type: string
          example: 'Zona Alun-Alun Sidoarjo'
        description:
          type: string
          example: 'Pusat keramaian publik dan taman kota'
        max_capacity:
          type: integer
          default: 3
        status:
          type: string
          enum:
            - ACTIVE
            - RESTRICTED
            - INACTIVE
          default: ACTIVE
        polygon:
          type: object
          description: 'GeoJSON Polygon Coordinates'
          example:
            type: Polygon
            coordinates:
              -
                -
                  - 112.716
                  - -7.447
                -
                  - 112.72
                  - -7.447
                -
                  - 112.72
                  - -7.45
                -
                  - 112.716
                  - -7.45
                -
                  - 112.716
                  - -7.447
