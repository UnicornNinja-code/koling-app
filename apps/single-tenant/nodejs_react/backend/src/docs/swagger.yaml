openapi: 3.0.3
info:
  title: MOVA / COZIS API Specification (Single-Tenant)
  description: >
    Single Source of Truth (SSOT) API Contract for MOVA (Coffee Operational Zone Intelligence System).
    Architecture: Single-Tenant, Node.js + Express 5, PostgreSQL + PostGIS, 4-Role RBAC (SUPERADMIN, MANAGEMENT, SUPERVISOR, RIDER).
  version: 1.0.0
  contact:
    name: MOVA Engineering Team
servers:
  - url: http://localhost:5000/api
    description: Local Single-Tenant Development Server
  - url: /api
    description: Relative Path

tags:
  - name: Auth
    description: Authentication, Token Management & Password Recovery
  - name: User Account
    description: User Account Administration & Hierarchy Guard (Superadmin & Management)
  - name: Zone Master
    description: Spatial Polygon Geofences, Polygon Validation & Master Configuration
  - name: DSS Engine
    description: Hybrid BWM-TOPSIS Multi-Criteria Decision Engine & Snapshots
  - name: POI & Spatial
    description: Point of Interest Ingestion, Classification, Approval & Density (C1, C3)
  - name: Competitors
    description: Field Competitor Survey Data & C6 Competitor Density Scoring
  - name: Candidate Locations
    description: High-Potential Candidate Selling Spots In-Zone Clustering
  - name: Weather & Roads
    description: Open-Meteo Weather Evaluation (C2) & Protocol/Toll Road Restrictions (C4)
  - name: Armada Fleet
    description: Master Fleet Units, 5-Minute Hold & Claim Workflow
  - name: Rider Operations
    description: Daily Rider Workflow (Hold, Claim, Check-In, Sales, Checkout)
  - name: Distribution & Plotting
    description: Rider Duty Queue, TOPSIS FIFO Distribution & Manual Plotting
  - name: Catalog & Products
    description: Master Products, Pricing & Menu Items
  - name: Sales & Revenue
    description: Daily Sales Recording, Aggregation & Performance Metrics
  - name: LBS Telemetry
    description: Location-Based Telemetry & Spatial Restriction Monitoring
  - name: Dashboard & Analytics
    description: Role-Based Performance Metrics & Reporting Summaries
  - name: Audit & Settings
    description: System Activity Audit Trail & System Configuration Settings

paths:
  # ==========================================================================
  # AUTH DOMAIN
  # ==========================================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: User Login (Email or Username + Password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Email address or username (case-insensitive)
                  example: superadmin@kopikeliling.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        200:
          description: Login Successful (Returns JWT Access Token & User Profile)
        401:
          description: Invalid Credentials or Inactive Account

  /auth/register:
    post:
      tags: [Auth]
      summary: Register New User (Restricted by Role Hierarchy Guard)
      security:
        - BearerAuth: []
      description: >
        SUPERADMIN can create any role.
        MANAGEMENT can only create MANAGEMENT, SUPERVISOR, or RIDER (Cannot create SUPERADMIN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        201:
          description: User Created Successfully
        403:
          description: Forbidden (Management attempted to create Superadmin)

  /auth/me:
    get:
      tags: [Auth]
      summary: Get Authenticated User Profile & Active Session
      security:
        - BearerAuth: []
      responses:
        200:
          description: Current User Profile

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh Expired Access Token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: New Access Token Issued

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate Session & Revoke Token
      security:
        - BearerAuth: []
      responses:
        200:
          description: Logged Out Successfully

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request Password Reset Link / Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Password Reset Token Generated

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Submit New Password with Reset Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password Reset Successfully

  /auth/first-login:
    post:
      tags: [Auth]
      summary: Force Password Change on First Superadmin Login
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  format: password
                  example: SuperSecureAdmin2026!
      responses:
        200:
          description: Password Updated and first_login flag set to false
        400:
          description: Validation Error

  /auth/activate:
    post:
      tags: [Auth]
      summary: Activate User Account via Invitation Token with Birth Date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, birth_date]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                birth_date:
                  type: string
                  format: date
                  example: "1995-08-17"
      responses:
        200:
          description: Account Activated Successfully
        400:
          description: Invalid or Expired Activation Token

  # ==========================================================================
  # USER ACCOUNT DOMAIN (HIERARCHY GUARD)
  # ==========================================================================
  /users:
    get:
      tags: [User Account]
      summary: List All User Accounts (Filter by Role, Search)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [SUPERADMIN, MANAGEMENT, SUPERVISOR, RIDER]
        - in: query
          name: search
          schema:
            type: string
      responses:
        200:
          description: List of Users
    post:
      tags: [User Account]
      summary: Administrative User Creation (Enforces Role Hierarchy)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        201:
          description: User Created
        403:
          description: Forbidden (Hierarchy Guard Rejection)

  /users/{id}:
    get:
      tags: [User Account]
      summary: Get User Account Details
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: User Details
    put:
      tags: [User Account]
      summary: Update User Account (Profile, Role, Contact)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                username: { type: string }
                phone: { type: string }
                role: { type: string, enum: [SUPERADMIN, MANAGEMENT, SUPERVISOR, RIDER] }
      responses:
        200:
          description: User Updated
        403:
          description: Forbidden (Cannot modify Superadmin account as Management)
    delete:
      tags: [User Account]
      summary: Deactivate or Delete User Account
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: User Deleted

  /users/{id}/status:
    patch:
      tags: [User Account]
      summary: Toggle User Active Status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        200:
          description: User Status Updated

  # ==========================================================================
  # ZONE MASTER & SPATIAL VALIDATION DOMAIN
  # ==========================================================================
  /zones:
    get:
      tags: [Zone Master]
      summary: List All Spatial Zones with Polygon & Status
      security:
        - BearerAuth: []
      responses:
        200:
          description: GeoJSON/JSON Array of Operational Zones
    post:
      tags: [Zone Master]
      summary: Create New Operational Zone Polygon (SUPERADMIN ONLY)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        201:
          description: Zone Created with PostGIS Geometry
        400:
          description: Validation Failed (Overlap, Restricted Toll Road, Self-Intersection, or Area Out-of-Bounds)

  /zones/validate:
    post:
      tags: [Zone Master]
      summary: Dry-run Spatial Validation of Zone Polygon Before Saving (SUPERADMIN ONLY)
      description: >
        Validates GeoJSON Polygon against:
        1. Self-intersection & geometry validity (ST_IsValid)
        2. Area boundaries (min 1,000 m², max 5,000,000 m²)
        3. Overlap with existing active zones (ST_Overlaps / ST_Contains)
        4. Intersection with Restricted Toll Road Buffer zones
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [polygon]
              properties:
                polygon:
                  type: object
                  description: GeoJSON Polygon Geometry
                  example:
                    type: "Polygon"
                    coordinates:
                      - [[112.716, -7.447], [112.720, -7.447], [112.720, -7.450], [112.716, -7.450], [112.716, -7.447]]
                exclude_zone_id:
                  type: string
                  format: uuid
                  description: Optional Zone ID to exclude during polygon edit
      responses:
        200:
          description: Validation Results (valid, area_sqm, warnings, errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  area_sqm: { type: number, example: 45000.50 }
                  area_valid: { type: boolean, example: true }
                  overlap_check:
                    type: object
                    properties:
                      has_overlap: { type: boolean, example: false }
                      overlapping_zones: { type: array, items: { type: object } }
                  restricted_road_check:
                    type: object
                    properties:
                      intersects_restricted_road: { type: boolean, example: false }
                      road_names: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }

  /zones/{id}:
    get:
      tags: [Zone Master]
      summary: Get Specific Zone Details with Spatial Validation Reasons
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Zone Object
    put:
      tags: [Zone Master]
      summary: Update Zone Master Data & Polygon (SUPERADMIN ONLY)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        200:
          description: Zone Updated
    delete:
      tags: [Zone Master]
      summary: Delete Zone (SUPERADMIN ONLY)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Zone Deleted

  /zones/{id}/status:
    patch:
      tags: [Zone Master]
      summary: Update Zone Status (ACTIVE, RESTRICTED, INACTIVE)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, RESTRICTED, INACTIVE] }
      responses:
        200:
          description: Zone Status Changed

  # ==========================================================================
  # DSS ENGINE DOMAIN (HYBRID BWM-TOPSIS)
  # ==========================================================================
  /dss/bwm/calculate:
    post:
      tags: [DSS Engine]
      summary: Execute Best-Worst Method (BWM) Linear Programming Solver (SUPERADMIN ONLY)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [best_criteria_id, worst_criteria_id, best_to_others, worst_to_others]
              properties:
                name: { type: string, example: "Bobot BWM Q3 Sidoarjo 2026" }
                best_criteria_id: { type: string, format: uuid }
                worst_criteria_id: { type: string, format: uuid }
                best_to_others: { type: object, description: "Pairwise comparisons 1-9 from Best to Others" }
                worst_to_others: { type: object, description: "Pairwise comparisons 1-9 from Others to Worst" }
      responses:
        200:
          description: BWM Weights Computed Successfully (Consistency Ratio CR <= 0.10)
        400:
          description: Inconsistent Preferences (CR > 0.10)

  /dss/bwm/preview-impact:
    post:
      tags: [DSS Engine]
      summary: Preview & Simulate BWM Weight Impact on TOPSIS Zone Rankings without Saving (SUPERADMIN, SUPERVISOR, MANAGEMENT)
      description: >
        Performs what-if simulation to project TOPSIS zone rankings when BWM weights change,
        without committing changes to the database. Supports either raw custom weights or BWM pairwise comparisons.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                time_slot:
                  type: string
                  enum: [pagi, siang, sore, malam]
                  default: pagi
                weights:
                  type: object
                  description: "Optional direct criteria weights map (e.g. { C1: 0.25, C2: 0.15, ... })"
                  example:
                    C1: 0.25
                    C2: 0.15
                    C3: 0.20
                    C4: 0.15
                    C5: 0.10
                    C6: 0.15
                best_criteria_id:
                  type: string
                  format: uuid
                worst_criteria_id:
                  type: string
                  format: uuid
                best_to_others:
                  type: object
                worst_to_others:
                  type: object
      responses:
        200:
          description: Simulation Result with Projected TOPSIS Zone Rankings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  time_slot: { type: string, example: "pagi" }
                  total_zones: { type: integer, example: 5 }
                  rankings:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer, example: 1 }
                        zone_id: { type: string, format: uuid }
                        zone_name: { type: string, example: "Zona Alun-Alun Sidoarjo" }
                        topsis_score: { type: number, example: 0.8421 }
                        category: { type: string, example: "SANGAT_DIREKOMENDASIKAN" }


  /dss/bwm/active:
    get:
      tags: [DSS Engine]
      summary: Get Currently Active BWM Criteria Weights & Thresholds (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      responses:
        200:
          description: Active DSS Configuration & Weights

  /dss/bwm/configs:
    get:
      tags: [DSS Engine]
      summary: List All Saved BWM Weight Configurations (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      responses:
        200:
          description: Array of Saved BWM Configurations

  /dss/bwm/{id}/activate:
    post:
      tags: [DSS Engine]
      summary: Activate a Specific BWM Configuration by ID (SUPERADMIN ONLY)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Configuration Activated Successfully

  /dss/zones/{id}/raw-evaluation:
    get:
      tags: [DSS Engine]
      summary: Get Raw Multi-Criteria Evaluation Data (C1 - C6) for a Zone (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: time
          schema: { type: string, enum: [pagi, siang, sore, malam] }
        - in: query
          name: lat
          schema: { type: number, format: double }
        - in: query
          name: lon
          schema: { type: number, format: double }
      responses:
        200:
          description: Raw Criteria Matrix (C1 Density, C2 Weather, C3 Events, C4 Roads, C5 Distance, C6 Competitor Score)

  /dss/evaluate:
    post:
      tags: [DSS Engine]
      summary: Execute Hybrid BWM-TOPSIS Evaluation for Selected Zones (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_ids:
                  type: array
                  items: { type: string, format: uuid }
                time_slot:
                  type: string
                  enum: [pagi, siang, sore, malam]
                lat: { type: number, format: double }
                lon: { type: number, format: double }
                bwm_config_id: { type: string, format: uuid }
      responses:
        200:
          description: TOPSIS Multi-Zone Ranking Matrix & Relative Closeness Score V_i

  /dss/snapshots:
    get:
      tags: [DSS Engine]
      summary: Get Historical DSS Evaluation Snapshots (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: List of Historical Evaluation Snapshots

  /dss/snapshots/{id}:
    get:
      tags: [DSS Engine]
      summary: Get Snapshot Details by ID (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Snapshot Evaluation Details

  /dss/recommendations:
    get:
      tags: [DSS Engine]
      summary: Get Top Zone Recommendations for Authenticated Rider
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: time
          schema: { type: string, enum: [pagi, siang, sore, malam] }
        - in: query
          name: lat
          schema: { type: number, format: double }
        - in: query
          name: lon
          schema: { type: number, format: double }
      responses:
        200:
          description: Personalized Selling Zone Recommendations

  # ==========================================================================
  # POI & SPATIAL DOMAIN (CRITERIA C1 & C3)
  # ==========================================================================
  /pois:
    get:
      tags: [POI & Spatial]
      summary: List All Approved POIs (Filter by Category, Zone)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: category_id
          schema: { type: string, format: uuid }
        - in: query
          name: zone_id
          schema: { type: string, format: uuid }
      responses:
        200:
          description: List of POIs
    post:
      tags: [POI & Spatial]
      summary: Submit New POI (Pending Approval)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category_id, latitude, longitude]
              properties:
                name: { type: string, example: "Kantor Cabang Bank Mandiri" }
                category_id: { type: string, format: uuid }
                latitude: { type: number, format: double, example: -7.4478 }
                longitude: { type: number, format: double, example: 112.7183 }
      responses:
        201:
          description: POI Submitted for Approval

  /pois/unapproved:
    get:
      tags: [POI & Spatial]
      summary: List Unapproved POIs Awaiting Moderation (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      responses:
        200:
          description: Pending POIs List

  /pois/{id}/approve:
    patch:
      tags: [POI & Spatial]
      summary: Approve POI Submission (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: POI Approved

  /pois/{id}/reject:
    patch:
      tags: [POI & Spatial]
      summary: Reject POI Submission (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: POI Rejected

  /pois/categories:
    get:
      tags: [POI & Spatial]
      summary: List Master POI Categories & Weights
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of POI Categories

  /pois/density/{zone_id}:
    get:
      tags: [POI & Spatial]
      summary: Calculate C1 POI Density Score for a Zone
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: zone_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: C1 POI Density Score & Category Breakdown

  /pois/events/{zone_id}:
    get:
      tags: [POI & Spatial]
      summary: Calculate C3 Event / Crowd Impact Score for a Zone
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: zone_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: C3 Event Impact Score

  # ==========================================================================
  # COMPETITOR DOMAIN (CRITERIA C6)
  # ==========================================================================
  /competitors/score/{zone_id}:
    get:
      tags: [Competitors]
      summary: Calculate C6 Competitor Density Score for a Zone (Relevance Weighted)
      description: >
        Calculates C6 score based on:
        1. Field survey competitors (competitors table)
        2. Coffee shop POIs inside the zone
        Formula: R_i = 0.50 * S_price + 0.30 * I_category + 0.20 * I_model
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: zone_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: C6 Competitor Density Score & Competitor Breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  zone_id: { type: string, format: uuid }
                  skor_c6: { type: number, example: 0.72 }
                  total_competitors_count: { type: integer, example: 4 }
                  field_competitors_count: { type: integer, example: 2 }
                  coffee_poi_count: { type: integer, example: 2 }
                  details: { type: array, items: { type: object } }

  /competitors/zone/{zone_id}:
    get:
      tags: [Competitors]
      summary: List Field Survey Competitors Assigned to a Zone
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: zone_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: List of Survey Competitors

  /competitors:
    post:
      tags: [Competitors]
      summary: Add New Field Survey Competitor Record (SUPERADMIN, SUPERVISOR)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_id, name, latitude, longitude]
              properties:
                zone_id: { type: string, format: uuid }
                name: { type: string, example: "Kopi Kenangan Alun-alun" }
                category: { type: string, example: "CHAIN_COFFEE" }
